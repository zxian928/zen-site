<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen.C</title>
  <meta name="description" content="Zen — full-stack developer." />
  <meta property="og:title" content="Zen" />
  <meta property="og:description" content="Full-stack developer." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◐</text></svg>" />
  <style>
    :root {
      --bg: #0b0d10;
      --text: #e6e8eb;
      --muted: #9aa4b2;
      --accent: #a78bfa;
      --accent-2: #e879f9;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf9fc;
        --text: #14121c;
        --muted: #6b6480;
        --accent: #7c3aed;
        --accent-2: #c026d3;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* animated code-rain backdrop */
    #rain {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      display: block;
    }
    /* soft glow + vignette so the name stays readable */
    .veil {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(closest-side 340px 240px at 50% 46%, color-mix(in srgb, var(--bg) 78%, transparent), transparent 100%),
        radial-gradient(1200px 800px at 50% 50%, transparent 30%, color-mix(in srgb, var(--bg) 55%, transparent) 100%);
    }

    .card {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 56px clamp(32px, 8vw, 80px);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 20px;
      background: color-mix(in srgb, var(--bg) 62%, transparent);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--bg) 40%, transparent),
        0 20px 60px -20px color-mix(in srgb, var(--accent) 45%, transparent),
        inset 0 1px 0 color-mix(in srgb, #ffffff 10%, transparent);
      animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards;
      opacity: 0; transform: translateY(20px);
    }
    /* glowing corner accents */
    .card::before, .card::after {
      content: ""; position: absolute; width: 22px; height: 22px;
      border: 2px solid var(--accent-2); opacity: .8;
    }
    .card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-radius: 20px 0 0 0; }
    .card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-radius: 0 0 20px 0; }

    .name {
      font-size: clamp(56px, 18vw, 140px);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; transform: translateY(20px);
      animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .name .suffix {
      -webkit-text-fill-color: var(--accent);
      color: var(--accent);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12.5px; letter-spacing: .3px; color: var(--muted);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-radius: 999px; padding: 5px 13px; margin-bottom: 22px;
      opacity: 0; transform: translateY(20px);
      animation: rise .8s cubic-bezier(.2,.7,.2,1) .05s forwards;
    }
    .badge .pulse {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 0 var(--accent); animation: ping 2s infinite;
    }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 65%, transparent); }
      70% { box-shadow: 0 0 0 7px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .tag {
      margin-top: 20px;
      font-size: clamp(15px, 3.2vw, 19px);
      line-height: 1.7;
      color: var(--muted);
      max-width: 440px;
      opacity: 0; transform: translateY(20px);
      animation: rise .8s cubic-bezier(.2,.7,.2,1) .15s forwards;
    }
    .tag b {
      display: inline-block; margin-top: 4px; font-weight: 600;
      color: var(--text);
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .links {
      margin-top: 32px;
      display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
      opacity: 0; transform: translateY(20px);
      animation: rise .8s cubic-bezier(.2,.7,.2,1) .3s forwards;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; padding: 11px 22px;
      border-radius: 10px; border: 1px solid var(--accent);
      transition: transform .15s, box-shadow .15s, background .15s, color .15s;
    }
    .btn.primary {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #0b0d10; border-color: transparent;
    }
    .btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .btn.ghost {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .btn.ghost:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .btn.whatsapp {
      color: #fff; background: #25d366; border-color: transparent;
    }
    .btn.whatsapp:hover {
      transform: translateY(-2px); background: #20bd5a;
      box-shadow: 0 10px 30px -8px rgba(37,211,102,.6);
    }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="veil"></div>

  <script>
  (function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canvas = document.getElementById('rain');
    var ctx = canvas.getContext('2d');

    // read theme accent from CSS
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    var head = '#ffffff';
    var body = cssVar('--accent') || '#a78bfa';
    var glow = cssVar('--accent-2') || '#e879f9';

    var glyphs = '01{}[]()<>/\\=;:+-*&|!$#%._abcdef01'.split('');
    var fontSize = 16, cols = 0, drops = [], dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.floor(window.innerWidth / fontSize);
      drops = new Array(cols);
      for (var i = 0; i < cols; i++) drops[i] = Math.random() * -50;
    }

    function pick() { return glyphs[(Math.random() * glyphs.length) | 0]; }

    function draw() {
      // translucent fade for trailing effect
      ctx.fillStyle = 'rgba(11,13,16,0.10)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.font = fontSize + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

      for (var i = 0; i < cols; i++) {
        var x = i * fontSize;
        var y = drops[i] * fontSize;
        if (y > 0) {
          // bright head
          ctx.fillStyle = head;
          ctx.globalAlpha = 0.9;
          ctx.fillText(pick(), x, y);
          // colored char just above
          ctx.fillStyle = Math.random() > 0.5 ? body : glow;
          ctx.globalAlpha = 0.55;
          ctx.fillText(pick(), x, y - fontSize);
        }
        if (y > window.innerHeight && Math.random() > 0.99) drops[i] = Math.random() * -20;
        drops[i] += 0.22;
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);

    if (reduce) {
      // static faint frame, no animation
      ctx.fillStyle = 'rgba(11,13,16,1)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.font = fontSize + 'px ui-monospace, monospace';
      ctx.fillStyle = body; ctx.globalAlpha = 0.25;
      for (var i = 0; i < cols; i++) {
        for (var j = 0; j < window.innerHeight / fontSize; j += 3) {
          if (Math.random() > 0.7) ctx.fillText(pick(), i * fontSize, j * fontSize);
        }
      }
      ctx.globalAlpha = 1;
    } else {
      draw();
    }
  })();
  </script>
</body>
